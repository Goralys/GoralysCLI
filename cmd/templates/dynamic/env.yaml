file: "backend/.env"
ref: "package.json"

3.1.0:
  Database:
    DATABASE_HOST: "localhost"
    DATABASE_ID: "your db username"
    DATABASE_PASSWORD: "your db password"
  Php:
    PHP_SESSION_LIFETIME: 3600
    PHP_SESSION_LIFETIME_MULTIPLIER: 1.25
    GORALYS_ENVIRONMENT: "dev"
  Domains:
    ALLOWED_DOMAINS: "http://localhost:3000, http://localhost"
    MASTER_DOMAIN: "goralys.test"
    COOKIES_DOMAIN: ".goralys.test"
  Mail:
    MAIL_HOST: "smtp.exemple.com"
    MAIL_PORT: 42
    MAIL_USERNAME: "your mail username"
    MAIL_PASSWORD: "your mail password"
    MAIL_ADMIN_ADDRESS: "me@gmail.com, admin@exemple.com"